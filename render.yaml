# Render Blueprint for BOF Edge backend + PostgreSQL.
# Deploy via Render Dashboard -> New -> Blueprint, or `render blueprint launch`.
databases:
  - name: bof-scanner-db
    databaseName: bof_scanner
    user: bof
    plan: free

services:
  - type: web
    name: bof-scanner-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: bof-scanner-db
          property: connectionString
      # --- Set these in the Render dashboard (do NOT commit real values) ---
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "14"
      - key: CORS_ORIGINS
        value: "*"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: MARKET_DATA_API_KEY
        sync: false
