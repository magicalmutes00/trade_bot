<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<script src="lightweight-charts.standalone.production.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #0B0F14; overflow: hidden;
               font-family: Roboto, sans-serif; }
  #legend { position: absolute; top: 8px; left: 10px; z-index: 10;
            background: rgba(18,24,33,.9); border-radius: 6px; padding: 5px 9px;
            font-size: 11px; line-height: 15px; font-family: monospace;
            pointer-events: none; color: #16C784; white-space: pre; }
  #chart { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="legend"></div>
<div id="chart"></div>
<script>
const UP = '#16C784', DOWN = '#EA3943', GRID = '#1A2230', TEXT = '#8A97A8',
      BG = '#0B0F14', ACCENT = '#4E9CFF';
let chart = null, candleS = null, volS = null, lastBar = null;

function fmtLegend(el, o, h, l, c, v, pct, hover) {
  const col = c >= o ? UP : DOWN;
  const s = pct === null ? '' : ' ' + (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%';
  el.style.color = col;
  el.textContent =
    'O ' + o.toFixed(2) + ' H ' + h.toFixed(2) + ' L ' + l.toFixed(2) +
    ' C ' + c.toFixed(2) + s + '\n' +
    'V ' + v.toLocaleString('en-IN') + (hover ? ' · hover' : '');
}

function init() {
  if (chart) return;
  chart = LightweightCharts.createChart(document.getElementById('chart'), {
    autoSize: true,
    layout: { background: { color: BG }, textColor: TEXT, fontSize: 11 },
    grid: { vertLines: { color: GRID }, horzLines: { color: GRID } },
    crosshair: {
      vertLine: { color: ACCENT, labelBackgroundColor: ACCENT },
      horzLine: { color: ACCENT, labelBackgroundColor: ACCENT },
    },
    timeScale: { timeVisible: true, secondsVisible: false, borderColor: GRID },
    rightPriceScale: { borderColor: GRID },
  });
  candleS = chart.addSeries(LightweightCharts.CandlestickSeries, {
    upColor: UP, downColor: DOWN, wickUpColor: UP, wickDownColor: DOWN, borderVisible: false,
  });
  volS = chart.addSeries(LightweightCharts.HistogramSeries, {
    priceScaleId: '', lastValueVisible: false, priceLineVisible: false,
  });
  volS.priceScale().applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });

  const legendEl = document.getElementById('legend');
  chart.subscribeCrosshairMove((param) => {
    const bar = param.seriesData.get(candleS);
    const vol = param.seriesData.get(volS);
    if (bar && legendEl) {
      fmtLegend(legendEl, bar.open, bar.high, bar.low, bar.close,
        vol ? vol.value : 0, lastBar ? lastBar.pct : null, true);
    } else if (lastBar && legendEl) {
      fmtLegend(legendEl, lastBar.o, lastBar.h, lastBar.l, lastBar.c, lastBar.v, lastBar.pct, false);
    }
  });
}

let priceLines = [];

function clearOverlays() {
  if (candleS && priceLines.length) {
    for (const l of priceLines) { try { candleS.removePriceLine(l); } catch (e) {} }
    priceLines = [];
  }
}

window.updateChart = function (json) {
  init();
  const p = JSON.parse(json);

  // bars arrive oldest-first from Kotlin
  const bars = [], vols = [];
  const seen = {};
  for (const c of p.candles) {
    if (seen[c.time]) continue;
    seen[c.time] = 1;
    bars.push({ time: c.time, open: c.open, high: c.high, low: c.low, close: c.close });
    vols.push({ time: c.time, value: c.volume, color: c.close >= c.open ? UP + '55' : DOWN + '55' });
  }
  candleS.setData(bars);
  volS.setData(vols);

  clearOverlays();
  const markers = [];
  for (const m of (p.markers || [])) {
    if (m.kind === 'price-line' && typeof m.price === 'number' && m.price > 0) {
      const line = candleS.createPriceLine({
        price: m.price,
        color: m.color || ACCENT,
        lineWidth: 1,
        lineStyle: 2 /* lineStyle.Dashed */,
        axisLabelVisible: true,
        title: m.title || '',
      });
      priceLines.push(line);
    } else if (m.kind === 'marker' && typeof m.time === 'number') {
      markers.push({
        time: m.time,
        position: m.position || 'aboveBar',
        shape: m.shape || 'circle',
        color: m.color || ACCENT,
        text: m.text || '',
      });
    }
  }
  if (markers.length) candleS.setMarkers(markers);

  if (bars.length) {
    const last = bars[bars.length - 1];
    const prev = bars.length > 1 ? bars[bars.length - 2].close : last.open;
    const pct = prev ? ((last.close - prev) / prev) * 100 : null;
    lastBar = { o: last.open, h: last.high, l: last.low, c: last.close,
                v: vols[vols.length - 1].value, pct };
    fmtLegend(document.getElementById('legend'),
      last.open, last.high, last.low, last.close, lastBar.v, pct, false);
  }
  chart.timeScale().fitContent();
};
</script>
</body>
</html>
