# =====================================================================
# BOF Edge — project-wide Gradle settings.
#
# APP NAME (single source of truth):
#   Change BOF_APP_NAME here to rebrand the whole app.
#
# FIREBASE GOOGLE SIGN-IN:
#   Set BOF_FIREBASE_WEB_CLIENT_ID to the OAuth 2.0 *Web* client ID from
#   Firebase Console -> Authentication -> Sign-in method -> Google ->
#   Web SDK configuration -> Web client ID. It is not a secret, but it is
#   kept out of Kotlin sources per project policy.
# =====================================================================
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# --- API base URLs (single source of truth for where the app connects) ---
# Production backend (your live Render service):
BOF_API_BASE_RELEASE=https://bof-edge-api.onrender.com/api/v1/
# Debug/emulator default below points at LOCAL dev; swap to the production
# URL when you want debug builds hitting the live server:
BOF_API_BASE_DEBUG=https://bof-edge-api.onrender.com/api/v1/
# Local-development value (restore for offline work):
#   http://10.0.2.2:8000/api/v1/

BOF_APP_NAME=TradeBot
BOF_FIREBASE_WEB_CLIENT_ID=
