services:
  postgres:
    image: postgres:16-alpine
    container_name: bof-scanner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bof}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bof_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-bof_scanner}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bof} -d ${POSTGRES_DB:-bof_scanner}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
